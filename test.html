<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UFS Secure Mapper | Frame 19</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .map-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="coverPage" class="min-h-screen flex flex-col items-center justify-center bg-white">
        <div class="text-center px-6">
            <div class="mb-6 inline-block p-4 bg-indigo-50 rounded-2xl">
                <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h1 class="text-5xl font-extrabold text-slate-900 tracking-tight mb-4">UFS Secure Dashboard</h1>
            <p class="text-lg text-slate-500 mb-10 max-w-lg mx-auto">Authorized Access Only. Frame Code 19 Boundary Management System.</p>
            <button onclick="switchToMainPage()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-12 rounded-xl transition-all shadow-lg hover:shadow-indigo-200">
                Enter System
            </button>
        </div>
    </div>

    <div id="mainPage" class="hidden h-screen flex flex-col">
        <nav class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shrink-0">
            <div class="flex items-center gap-4">
                <div class="p-2 bg-indigo-600 rounded-lg text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path></svg>
                </div>
                <div>
                    <h2 class="font-bold text-slate-900 leading-none">UFS Frame 19</h2>
                    <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Admin Controlled</span>
                </div>
            </div>
            <div class="flex gap-3">
                <button onclick="uploadKMLZip()" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 rounded-lg text-sm font-medium transition-colors">Import KMLs</button>
                <button onclick="showExportModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm font-medium shadow-sm transition-colors">Export Bundle</button>
                <button onclick="toggleAdminLog()" class="p-2 text-slate-300 hover:text-indigo-600 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                </button>
            </div>
        </nav>

        <div class="flex grow overflow-hidden">
            <div class="w-1/2 p-6 bg-slate-50 flex flex-col">
                <div id="map" class="grow rounded-2xl map-shadow border border-slate-200 bg-white"></div>
                <div id="kmlStatus" class="mt-4 px-4 py-2 bg-white rounded-lg border border-slate-200 text-xs text-slate-500 italic">No KML files in memory.</div>
            </div>

            <div class="w-1/2 flex flex-col bg-white overflow-hidden border-l border-slate-200">
                <div class="p-6 border-b bg-slate-50/50">
                    <div class="grid grid-cols-3 gap-4">
                        <select id="townFilter" onchange="onTownChange()" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"></select>
                        <select id="ivFilter" onchange="onIVChange()" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"></select>
                        <select id="blockFilter" onchange="applyFilters()" class="w-full bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500"></select>
                    </div>
                </div>
                <div class="grow overflow-auto custom-scrollbar">
                    <table id="dataTable" class="w-full text-left border-collapse"></table>
                </div>
            </div>
        </div>
    </div>

    <div id="exportModal" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[10000]">
        <div class="bg-white p-8 rounded-2xl shadow-2xl w-96 border border-slate-100">
            <div class="mb-4 text-indigo-600">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
            </div>
            <h3 class="text-xl font-bold text-slate-900 mb-2">Security Verification</h3>
            <p class="text-sm text-slate-500 mb-6">Enter password to authorize data export and KML extraction.</p>
            <input type="password" id="adminPassword" placeholder="Enter Password" class="w-full border border-slate-200 rounded-xl px-4 py-3 mb-6 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
            <div class="flex gap-3">
                <button onclick="closeExportModal()" class="flex-1 py-3 text-slate-500 font-bold hover:bg-slate-50 rounded-xl transition-colors">Cancel</button>
                <button onclick="processExport()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-200">Authorize</button>
            </div>
        </div>
    </div>

    <div id="adminLog" class="hidden fixed top-20 right-6 w-80 bg-slate-900 text-white p-6 rounded-2xl shadow-2xl z-[9999] max-h-[70vh] overflow-auto border border-white/10">
        <h4 class="font-bold text-indigo-400 border-b border-white/10 pb-3 mb-4 flex justify-between items-center">
            Export History
            <span class="text-[10px] bg-indigo-500/20 px-2 py-1 rounded text-indigo-300">ADMIN</span>
        </h4>
        <div id="logContent" class="space-y-3 text-[11px]">
            <div class="text-slate-500 italic">No export activity recorded yet.</div>
        </div>
    </div>

    <div id="toast" onclick="this.classList.add('hidden')" class="hidden fixed bottom-6 right-6 px-6 py-4 rounded-xl shadow-2xl z-[10001] text-white font-medium animate-bounce-in cursor-pointer"></div>

    <script>
        let map, currentData = [], kmlCache = {}, lastFilteredData = [], downloadHistory = [];
        const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR9KzSaQ0wEMPina6sQwv3Nsrh8tl0DSPeHiEk41IYizIHY4BnzH39sTAlFlvtZsm9YdoSYEt0bNYaj/pub?output=csv";
        const requiredColumns = ["District Name", "Town Name", "North", "East", "South", "West", "IV Unit Number", "Ward No", "Block Number"];

        function initMap() {
            if (!map) {
                map = L.map('map', { zoomControl: false }).setView([31.4, 76.7], 10);
                L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
            }
        }

        function switchToMainPage() {
            document.getElementById('coverPage').classList.add('hidden');
            document.getElementById('mainPage').classList.remove('hidden');
            initMap();
            loadGoogleSheet();
        }

        async function loadGoogleSheet() {
            showToast("Connecting to cloud database...", "loading");
            // Cache busting added to URL to prevent sync issues on other devices
            const finalUrl = `${sheetUrl}&cb=${new Date().getTime()}`;
            
            Papa.parse(finalUrl, {
                download: true, header: true, skipEmptyLines: true,
                complete: (res) => {
                    currentData = res.data.filter(r => r["Town Name"]);
                    populateTowns();
                    applyFilters();
                    showToast(`Synced ${currentData.length} records.`, "success");
                },
                error: () => showToast("Sync failed. Check connection.", "error")
            });
        }

        function populateTowns() {
            const towns = [...new Set(currentData.map(r => r["Town Name"]))].sort();
            const sel = document.getElementById('townFilter');
            sel.innerHTML = '<option value="">All Towns</option>';
            towns.forEach(t => sel.add(new Option(t, t)));
            document.getElementById('ivFilter').innerHTML = '<option value="">All IV Units</option>';
            document.getElementById('blockFilter').innerHTML = '<option value="">All Blocks</option>';
        }

        function onTownChange() {
            const town = document.getElementById('townFilter').value;
            const ivSel = document.getElementById('ivFilter');
            ivSel.innerHTML = '<option value="">All IV Units</option>';
            if (town) {
                const ivs = [...new Set(currentData.filter(r => r["Town Name"] === town).map(r => r["IV Unit Number"]))].sort();
                ivs.forEach(iv => ivSel.add(new Option(iv, iv)));
            }
            applyFilters();
        }

        function onIVChange() {
            const town = document.getElementById('townFilter').value;
            const iv = document.getElementById('ivFilter').value;
            const blockSel = document.getElementById('blockFilter');
            blockSel.innerHTML = '<option value="">All Blocks</option>';
            if (town && iv) {
                const blocks = [...new Set(currentData.filter(r => r["Town Name"] === town && r["IV Unit Number"] == iv).map(r => r["Block Number"]))].sort();
                blocks.forEach(b => blockSel.add(new Option(b, b)));
            }
            applyFilters();
        }

        function applyFilters() {
            const town = document.getElementById('townFilter').value;
            const iv = document.getElementById('ivFilter').value;
            const block = document.getElementById('blockFilter').value;
            lastFilteredData = currentData.filter(r => 
                (!town || r["Town Name"] === town) && 
                (!iv || r["IV Unit Number"] == iv) && 
                (!block || r["Block Number"] == block)
            );
            renderTable(lastFilteredData);
        }

        function renderTable(data) {
            let table = document.getElementById('dataTable');
            table.innerHTML = `
                <thead class="bg-slate-50 sticky top-0 border-b">
                    <tr><th class="px-4 py-3 text-[10px] font-bold text-slate-400 uppercase">Block Boundary Details</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100"></tbody>`;
            const tbody = table.querySelector('tbody');
            data.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 cursor-pointer transition-colors";
                tr.innerHTML = `
                    <td class="px-4 py-4">
                        <div class="font-bold text-slate-800 text-sm">${row["Town Name"]}</div>
                        <div class="text-[10px] text-slate-400 mb-2 uppercase">IV Unit: ${row["IV Unit Number"]} | Ward: ${row["Ward No"] || 'NA'} | Block: ${row["Block Number"]}</div>
                        <div class="grid grid-cols-2 gap-2 text-[10px] text-slate-500 bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <div><span class="font-bold text-slate-300">N:</span> ${row.North || '-'}</div>
                            <div><span class="font-bold text-slate-300">E:</span> ${row.East || '-'}</div>
                            <div><span class="font-bold text-slate-300">S:</span> ${row.South || '-'}</div>
                            <div><span class="font-bold text-slate-300">W:</span> ${row.West || '-'}</div>
                        </div>
                    </td>`;
                tbody.appendChild(tr);
            });
        }

        async function uploadKMLZip() {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = '.zip';
            input.onchange = async (e) => {
                showToast("Extracting KMLs...", "loading");
                const zip = await JSZip.loadAsync(e.target.files[0]);
                let count = 0;
                for (let name in zip.files) {
                    if (name.toLowerCase().endsWith('.kml')) {
                        kmlCache[name] = await zip.files[name].async('string');
                        count++;
                    }
                }
                document.getElementById('kmlStatus').innerHTML = `📦 ${count} KML boundaries stored in session.`;
                showToast(`Imported ${count} files.`, "success");
            };
            input.click();
        }

        function showExportModal() { document.getElementById('exportModal').classList.remove('hidden'); }
        function closeExportModal() { 
            document.getElementById('exportModal').classList.add('hidden'); 
            document.getElementById('adminPassword').value = ''; 
        }

        async function processExport() {
            if (document.getElementById('adminPassword').value !== "123") return showToast("Invalid Password", "error");

            showToast("Generating Bundle...", "loading");
            const zip = new JSZip();
            const now = new Date();
            const fileStamp = now.toISOString().replace(/[:.]/g, '-');

            // EXACT COLUMNS FROM YOUR SCREENSHOT
            const exportData = lastFilteredData.map(row => {
                let obj = {};
                requiredColumns.forEach(col => obj[col] = row[col] || "");
                return obj;
            });

            zip.file(`UFS_Data_Export_${fileStamp}.csv`, Papa.unparse(exportData));
            
            let kmlCount = 0;
            for (let row of lastFilteredData) {
                const ivNo = String(row["IV Unit Number"]).trim();
                for (let filename in kmlCache) {
                    if (filename.toLowerCase().includes(`iv${ivNo}`)) {
                        zip.file(filename, kmlCache[filename]);
                        kmlCount++; break;
                    }
                }
            }

            // Log entry
            downloadHistory.unshift({
                time: now.toLocaleString(),
                blocks: exportData.length,
                kmls: kmlCount
            });
            updateAdminLog();

            const blob = await zip.generateAsync({type: "blob"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `UFS_Secure_Bundle_${fileStamp}.zip`;
            a.click();
            
            showToast("Export Successful", "success");
            closeExportModal();
        }

        function updateAdminLog() {
            const container = document.getElementById('logContent');
            container.innerHTML = downloadHistory.map(h => `
                <div class="bg-white/5 p-3 rounded-xl border border-white/5">
                    <div class="text-indigo-400 font-bold mb-1">${h.time}</div>
                    <div class="text-slate-400">Blocks: ${h.blocks} | KMLs matched: ${h.kmls}</div>
                </div>
            `).join('');
        }

        function toggleAdminLog() { document.getElementById('adminLog').classList.toggle('hidden'); }

        function showToast(msg, type) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = `fixed bottom-6 right-6 px-6 py-4 rounded-xl z-[10001] transition-all ${
                type === 'error' ? 'bg-rose-600' : type === 'loading' ? 'bg-slate-800' : 'bg-emerald-600'
            }`;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 4000);
        }
    </script>
</body>
</html>
