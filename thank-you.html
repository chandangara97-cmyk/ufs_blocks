  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You — Luxotic India</title>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #b07d3a;
      --gold-light: #d4a55a;
      --dark: #1a1510;
      --mid: #2e2518;
      --cream: #f5efe4;
      --text: #3a2e1e;
      --muted: #7a6a52;
    }

    html, body {
      min-height: 100vh;
      font-family: 'Jost', sans-serif;
      background: var(--dark);
      color: var(--cream);
      overflow-x: hidden;
    }

    /* Mountain silhouette background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        linear-gradient(180deg,
          #0d0b08 0%,
          #1a1510 30%,
          #241d12 60%,
          #1a1510 100%
        );
      z-index: 0;
    }

    /* Stars */
    .stars {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 60%;
      z-index: 1;
      pointer-events: none;
    }
    .star {
      position: absolute;
      background: white;
      border-radius: 50%;
      animation: twinkle var(--d, 3s) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    /* Mountain SVG */
    .mountains {
      position: fixed;
      bottom: 0; left: 0;
      width: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Main layout */
    .page {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      text-align: center;
    }

    /* Logo */
    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      color: var(--gold-light);
      margin-bottom: 60px;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }

    /* Checkmark */
    .check-wrap {
      width: 72px;
      height: 72px;
      border: 1.5px solid var(--gold);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 40px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
      position: relative;
    }
    .check-wrap::before {
      content: '';
      position: absolute;
      inset: -6px;
      border-radius: 50%;
      border: 1px solid rgba(176,125,58,0.25);
    }
    .check-icon {
      width: 28px;
      height: 28px;
      stroke: var(--gold-light);
      stroke-width: 2;
      fill: none;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: drawCheck 0.6s ease 0.8s forwards;
    }
    @keyframes drawCheck {
      to { stroke-dashoffset: 0; }
    }

    /* Heading */
    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(38px, 8vw, 64px);
      line-height: 1.1;
      letter-spacing: -0.01em;
      color: var(--cream);
      margin-bottom: 8px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }
    h1 em {
      font-style: italic;
      color: var(--gold-light);
    }

    /* Divider */
    .divider {
      width: 48px;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 24px auto;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.5s forwards;
    }

    /* Subtext */
    .subtitle {
      font-size: 15px;
      font-weight: 300;
      color: rgba(245,239,228,0.7);
      line-height: 1.7;
      max-width: 400px;
      margin: 0 auto 48px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.6s forwards;
    }

    /* Info card */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(176,125,58,0.25);
      border-radius: 4px;
      padding: 28px 32px;
      max-width: 360px;
      width: 100%;
      margin: 0 auto 40px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.7s forwards;
    }
    .card-label {
      font-size: 10px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 16px;
    }
    .card-contact {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 400;
      color: var(--cream);
      margin-bottom: 6px;
    }
    .card-contact a {
      color: inherit;
      text-decoration: none;
    }
    .card-note {
      font-size: 12px;
      color: rgba(245,239,228,0.45);
      letter-spacing: 0.05em;
    }

    /* Back link */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.85s forwards;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--gold-light); }
    .back-link svg {
      width: 14px; height: 14px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.5;
      transition: transform 0.3s;
    }
    .back-link:hover svg { transform: translateX(-3px); }

    /* Coordinates */
    .coords {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 10px;
      letter-spacing: 0.2em;
      color: rgba(176,125,58,0.4);
      z-index: 3;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<script>
