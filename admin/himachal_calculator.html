<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxotic India — Cost Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pine:#1a3a2e;--pine-light:#2d5c47;--pine-pale:#e8f0eb;
  --gold:#c9922a;--gold-light:#f0d89a;--gold-pale:#fdf8ee;
  --stone:#f7f5f0;--stone-mid:#e8e4dc;--stone-dark:#b8b2a7;
  --ink:#1c1917;--ink-mid:#4a4540;--ink-light:#7a756e;
  --white:#ffffff;
  --snow:#e8f4fb;--snow-dark:#2563a8;
  --danger:#c0392b;--danger-pale:#fcecea;
  --success:#1a6b3c;--success-pale:#e8f5ee;
  --radius:12px;--radius-sm:8px;
  --shadow:0 2px 12px rgba(26,58,46,0.08);
  --shadow-lg:0 8px 32px rgba(26,58,46,0.14);
}
body{font-family:'DM Sans',sans-serif;background:var(--stone);color:var(--ink);min-height:100vh;line-height:1.6}

/* ── HEADER ── */
.site-header{background:var(--pine);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100}
.logo{font-family:'Playfair Display',serif;font-size:1.25rem;color:var(--white);letter-spacing:0.01em}
.logo span{color:var(--gold-light);font-style:italic}
.header-badge{font-size:11px;font-weight:500;color:var(--gold-light);background:rgba(201,146,42,0.15);border:1px solid rgba(201,146,42,0.3);padding:4px 12px;border-radius:20px;letter-spacing:0.05em;text-transform:uppercase}

/* ── HERO BANNER ── */
.hero{background:linear-gradient(135deg,var(--pine) 0%,var(--pine-light) 100%);padding:3rem 2rem 2.5rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E")}
.hero h1{font-family:'Playfair Display',serif;font-size:2.4rem;color:var(--white);font-weight:600;margin-bottom:0.5rem;position:relative}
.hero h1 em{color:var(--gold-light);font-style:italic}
.hero p{color:rgba(255,255,255,0.72);font-size:1rem;font-weight:300;position:relative;max-width:560px;margin:0 auto}

/* ── LAYOUT ── */
.app{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.grid-2{display:grid;grid-template-columns:380px 1fr;gap:1.5rem;align-items:start}
@media(max-width:800px){.grid-2{grid-template-columns:1fr}}

/* ── PANEL ── */
.panel{background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.panel-head{background:var(--pine);color:var(--white);padding:1rem 1.25rem;display:flex;align-items:center;gap:10px}
.panel-head h2{font-size:0.9rem;font-weight:500;letter-spacing:0.04em;text-transform:uppercase}
.panel-head svg{width:18px;height:18px;stroke:var(--gold-light);fill:none;stroke-width:1.8;flex-shrink:0}
.panel-body{padding:1.25rem}

/* ── FORM ELEMENTS ── */
.field{margin-bottom:1rem}
.field label{display:block;font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-light);margin-bottom:6px}
.field select,.field input[type=number]{width:100%;padding:10px 12px;border:1.5px solid var(--stone-mid);border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;color:var(--ink);background:var(--white);appearance:none;transition:border-color 0.2s}
.field select:focus,.field input[type=number]:focus{outline:none;border-color:var(--pine-light)}
.select-wrap{position:relative}
.select-wrap::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-light);pointer-events:none;font-size:12px}

/* Tier buttons */
.tier-group{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tier-btn{padding:10px 8px;border:1.5px solid var(--stone-mid);border-radius:var(--radius-sm);background:var(--white);cursor:pointer;text-align:center;transition:all 0.18s;font-family:inherit}
.tier-btn .tier-name{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-light)}
.tier-btn .tier-vehicle{font-size:10px;color:var(--stone-dark);margin-top:2px}
.tier-btn.active.budget{border-color:var(--pine-light);background:var(--pine-pale)}
.tier-btn.active.budget .tier-name{color:var(--pine)}
.tier-btn.active.premium{border-color:var(--gold);background:var(--gold-pale)}
.tier-btn.active.premium .tier-name{color:var(--gold)}
.tier-btn.active.luxury{border-color:#7c3aed;background:#f3f0ff}
.tier-btn.active.luxury .tier-name{color:#5b21b6}

/* Pax adjuster */
.pax-row{display:flex;align-items:center;gap:12px}
.pax-btn{width:36px;height:36px;border:1.5px solid var(--stone-mid);border-radius:var(--radius-sm);background:var(--white);cursor:pointer;font-size:1.2rem;color:var(--ink-mid);display:flex;align-items:center;justify-content:center;transition:all 0.15s;flex-shrink:0}
.pax-btn:hover{border-color:var(--pine-light);background:var(--pine-pale)}
.pax-display{flex:1;text-align:center}
.pax-number{font-size:1.6rem;font-weight:500;color:var(--pine);font-family:'Playfair Display',serif}
.pax-label{font-size:11px;color:var(--ink-light);text-transform:uppercase;letter-spacing:0.05em}

/* Calc btn */
.calc-btn{width:100%;padding:14px;background:var(--pine);color:var(--white);border:none;border-radius:var(--radius-sm);font-family:inherit;font-size:1rem;font-weight:500;cursor:pointer;transition:background 0.2s;margin-top:0.5rem;letter-spacing:0.02em}
.calc-btn:hover{background:var(--pine-light)}
.calc-btn:active{transform:scale(0.99)}

/* ── RESULTS ── */
.results-empty{padding:3rem 1.5rem;text-align:center;color:var(--ink-light)}
.results-empty svg{width:48px;height:48px;stroke:var(--stone-dark);fill:none;stroke-width:1.2;margin:0 auto 1rem;display:block}
.results-empty p{font-size:0.9rem}

/* Package header */
.pkg-header{padding:1.25rem 1.25rem 1rem;border-bottom:1px solid var(--stone-mid)}
.pkg-name{font-family:'Playfair Display',serif;font-size:1.2rem;color:var(--pine);line-height:1.3;margin-bottom:0.5rem}
.pkg-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;text-transform:capitalize}
.tag-season{background:var(--gold-pale);color:var(--gold)}
.tag-ideal{background:var(--pine-pale);color:var(--pine)}
.tag-days{background:var(--snow);color:var(--snow-dark)}
.tag-snow{background:#fef3f2;color:#b42318}
.tag-drive{background:#f0fdf4;color:#15803d}

/* Cost cards */
.cost-section{padding:1rem 1.25rem}
.cost-section h3{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-light);margin-bottom:12px}
.cost-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:1rem}
.cost-card{border-radius:var(--radius-sm);padding:0.9rem;text-align:center;border:1.5px solid transparent}
.cost-card.budget{background:var(--pine-pale);border-color:rgba(45,92,71,0.2)}
.cost-card.premium{background:var(--gold-pale);border-color:rgba(201,146,42,0.25)}
.cost-card.luxury{background:#f3f0ff;border-color:rgba(124,58,237,0.2)}
.cost-card.active{border-width:2px}
.cost-card.budget.active{border-color:var(--pine)}
.cost-card.premium.active{border-color:var(--gold)}
.cost-card.luxury.active{border-color:#7c3aed}
.cost-tier{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:4px}
.cost-card.budget .cost-tier{color:var(--pine)}
.cost-card.premium .cost-tier{color:var(--gold)}
.cost-card.luxury .cost-tier{color:#5b21b6}
.cost-per-person{font-size:1.3rem;font-weight:600;font-family:'Playfair Display',serif}
.cost-card.budget .cost-per-person{color:var(--pine)}
.cost-card.premium .cost-per-person{color:var(--gold)}
.cost-card.luxury .cost-per-person{color:#5b21b6}
.cost-total{font-size:11px;margin-top:4px;opacity:0.7}
.cost-vehicle{font-size:10px;opacity:0.6;margin-top:2px}

/* Breakdown */
.breakdown{background:var(--stone);border-radius:var(--radius-sm);padding:1rem;margin-top:0.5rem}
.breakdown-row{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:4px 0}
.breakdown-row:not(:last-child){border-bottom:1px solid var(--stone-mid)}
.breakdown-label{color:var(--ink-mid)}
.breakdown-val{font-weight:500;color:var(--ink)}
.breakdown-total{font-weight:600;font-size:14px;color:var(--pine);padding-top:8px;margin-top:4px;border-top:2px solid var(--stone-dark)!important}

/* Itinerary */
.itinerary{padding:0 1.25rem 1.25rem}
.itin-head{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;color:var(--ink-light);margin-bottom:10px}
.day-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px solid var(--stone-mid)}
.day-item:last-child{border-bottom:none}
.day-num{width:28px;height:28px;border-radius:50%;background:var(--pine);color:var(--white);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.day-text{font-size:13px;color:var(--ink-mid);line-height:1.5}

/* Inclusions/Exclusions */
.inc-exc{display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding:0 1.25rem 1.25rem}
@media(max-width:600px){.inc-exc{grid-template-columns:1fr}}
.inc-block h4,.exc-block h4{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:0.07em;margin-bottom:8px}
.inc-block h4{color:var(--success)}
.exc-block h4{color:var(--danger)}
.inc-block ul,.exc-block ul{list-style:none}
.inc-block li,.exc-block li{font-size:12px;color:var(--ink-mid);padding:3px 0;padding-left:16px;position:relative;line-height:1.4}
.inc-block li::before{content:'✓';position:absolute;left:0;color:var(--success);font-weight:600}
.exc-block li::before{content:'✗';position:absolute;left:0;color:var(--danger)}

/* Route bar */
.route-bar{background:var(--pine-pale);border-bottom:1px solid rgba(45,92,71,0.12);padding:0.75rem 1.25rem;font-size:12px;color:var(--pine-light);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.route-bar svg{width:14px;height:14px;stroke:var(--pine);flex-shrink:0}

/* KM badge */
.km-badge{background:var(--pine);color:var(--white);font-size:11px;font-weight:500;padding:2px 10px;border-radius:20px;margin-left:auto}

/* No result */
.no-result{padding:2rem;text-align:center;color:var(--ink-light);font-size:14px}

/* Section divider */
.divider{height:1px;background:var(--stone-mid);margin:0 1.25rem}

/* Sticky note */
.sticky-note{background:var(--gold-pale);border-left:3px solid var(--gold);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:0.75rem 1rem;margin:0 1.25rem 1.25rem;font-size:12px;color:var(--ink-mid);line-height:1.5}

/* Season warning */
.season-warn{background:var(--snow);border-left:3px solid var(--snow-dark);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:0.75rem 1rem;margin:0 1.25rem 1rem;font-size:12px;color:var(--snow-dark)}

/* Animate */
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.animate-in{animation:fadeUp 0.35s ease forwards}
</style>
</head>
<body>

<header class="site-header">
  <div style="display:flex;align-items:center;gap:16px">
    <a href="../packages.html" style="color:rgba(255,255,255,0.55);font-size:12px;text-decoration:none;display:flex;align-items:center;gap:5px;transition:color .2s" onmouseover="this.style.color='rgba(255,255,255,0.9)'" onmouseout="this.style.color='rgba(255,255,255,0.55)'">
      ← Packages
    </a>
    <div class="logo">Himachal <span>Explorer</span></div>
  </div>
  <div class="header-badge">Cost Calculator</div>
</header>

<div class="hero">
  <h1>Package <em>Cost Calculator</em></h1>
  <p>Gateway-aware pricing · Budget to Luxury · All 19 packages · Real-time breakdown</p>
</div>

<div class="app">
  <div class="grid-2">

    <!-- LEFT: INPUTS -->
    <div class="panel" id="inputPanel">
      <div class="panel-head">
        <svg viewBox="0 0 24 24"><path d="M9 7H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
        <h2>Booking Inputs</h2>
      </div>
      <div class="panel-body">

        <div class="field">
          <label>Select Package</label>
          <div class="select-wrap">
            <select id="pkgSel"></select>
          </div>
        </div>

        <div class="field">
          <label>Gateway City (Pickup)</label>
          <div class="select-wrap">
            <select id="gatewaySel">
              <option value="DELHI">Delhi</option>
              <option value="CHANDIGARH" selected>Chandigarh</option>
              <option value="AMRITSAR">Amritsar</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Drop City</label>
          <div class="select-wrap">
            <select id="dropSel">
              <option value="DELHI">Delhi</option>
              <option value="CHANDIGARH" selected>Chandigarh</option>
              <option value="SHIMLA">Shimla</option>
              <option value="DHARAMSHALA">Dharamshala</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label>Hotel Tier</label>
          <div class="tier-group">
            <button class="tier-btn budget active" data-tier="budget" onclick="setTier(this)">
              <div class="tier-name">Budget</div>
              <div class="tier-vehicle">Sedan</div>
            </button>
            <button class="tier-btn premium" data-tier="premium" onclick="setTier(this)">
              <div class="tier-name">Premium</div>
              <div class="tier-vehicle">Ertiga/Rumion · max 6</div>
            </button>
            <button class="tier-btn luxury" data-tier="luxury" onclick="setTier(this)">
              <div class="tier-name">Luxury</div>
              <div class="tier-vehicle">Tempo TL</div>
            </button>
          </div>
        </div>

        <div class="field">
          <label>Number of Travellers</label>
          <div class="pax-row">
            <button class="pax-btn" onclick="changePax(-1)">−</button>
            <div class="pax-display">
              <div class="pax-number" id="paxNum">4</div>
              <div class="pax-label">persons</div>
            </div>
            <button class="pax-btn" onclick="changePax(1)">+</button>
          </div>
        </div>

        <div class="field">
          <label>Travel Month</label>
          <div class="select-wrap">
            <select id="monthSel">
              <option value="1">January (Peak)</option>
              <option value="2">February</option>
              <option value="3">March</option>
              <option value="4">April</option>
              <option value="5">May (Peak)</option>
              <option value="6">June (Peak)</option>
              <option value="7">July</option>
              <option value="8">August</option>
              <option value="9">September</option>
              <option value="10">October</option>
              <option value="11">November</option>
              <option value="12">December (Peak)</option>
            </select>
          </div>
        </div>

        <button class="calc-btn" onclick="calculate()">Calculate Package Cost →</button>
      </div>
    </div>

    <!-- RIGHT: RESULTS -->
    <div id="resultsPanel">
      <div class="panel" id="resultsInner">
        <div class="results-empty" id="emptyState">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
          <p>Select a package and click<br><strong>Calculate Package Cost</strong><br>to see full pricing breakdown</p>
        </div>
        <div id="resultContent" style="display:none"></div>
      </div>
    </div>

  </div>
</div>

<script>
// GATEWAY_DATA: 360 entries from gateway_pricing, peak surcharge 15% from peak_season_config

udget":6160,"premium":9240,"luxury":12320},"shimla-hidden-3d|DELHI|DELHI":{"total_km":820,"hotel_budget":11840,"hotel_premium":16160,"hotel_luxury":26880,"transport_budget":3200,"transport_premium":5200,"transport_luxury":5600,"budget":6160,"premium":9240,"luxury":12320},"shimla-hidden-3d|DELHI|DHARAMSHALA":{"total_km":780,"hotel_budget":11840,"hotel_premium":16160,"hotel_luxury":26880,"transport_budget":3200,"transport_premium":5200,"transport_luxury":5600,"budget":6160,"premium":9240,"luxury":12320},"shimla-hidden-3d|DELHI|SHIMLA":{"total_km":450,"hotel_budget":11840,"hotel_premium":16160,"hotel_luxury":26880,"transport_budget":3200,"transport_premium":5200,"transport_luxury":5600,"budget":6160,"premium":9240,"luxury":12320}};

const PEAK_MONTHS = new Set([5, 6, 12, 1]); // kept for display only — PricingEngine.isPeakMonth() is the source of truth now

let selectedTier = 'budget';
let pax = 4;

function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN')}

function setTier(btn){
  document.querySelectorAll('.tier-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  selectedTier = btn.dataset.tier;
}

function changePax(d){
  pax = Math.max(1, Math.min(20, pax+d));
  document.getElementById('paxNum').textContent = pax;
}

function populatePackages(){
  const sel = document.getElementById('pkgSel');
  PACKAGES.forEach(p=>{
    const o = document.createElement('option');
    o.value = p.id;
    o.textContent = p.name.replace(/\u2014/g,'—');
    sel.appendChild(o);
  });
}

function getSeasonLabel(s){
  if(!s||s==='all_year') return 'All Year';
  return s.split(',').map(x=>x.charAt(0).toUpperCase()+x.slice(1)).join(', ');
}

function checkSeasonWarning(pkg, month){
  const m = parseInt(month);
  const s = pkg.best_season||'';
  if(s==='all_year'||!s) return null;
  const seasons = s.split(',');
  const monthSeasons = {
    1:'winter',2:'winter',3:'spring',4:'spring',
    5:'summer',6:'summer',7:'monsoon',8:'monsoon',
    9:'autumn',10:'autumn',11:'autumn',12:'winter'
  };
  const curSeason = monthSeasons[m];
  if(!seasons.includes(curSeason) && !seasons.includes('all_year')){
    return `Note: Best season is <strong>${getSeasonLabel(s)}</strong>. Your selected month may not be ideal for this package.`;
  }
  return null;
}

function calculate(){
  const pkgId = document.getElementById('pkgSel').value;
  const gateway = document.getElementById('gatewaySel').value;
  const drop = document.getElementById('dropSel').value;
  const month = parseInt(document.getElementById('monthSel').value);
  const isPeak = PricingEngine.isPeakMonth(month);

  const pkg = PACKAGES.find(p=>p.id===pkgId);
  if(!pkg) return;

  // Gateway/drop no longer affect price — GATEWAY_DATA is kept only as a
  // route/km lookup for display, falling back to the package's own total_km.
  const key = pkgId+'|'+gateway+'|'+drop;
  const gd = GATEWAY_DATA[key];
  const totalKm = (gd && gd.total_km) || pkg.total_km || 0;

  const tier = selectedTier;

  // ── Single source of truth: PricingEngine.computePrice() ──
  // (assets/js/pricing-engine.js) — the exact same formula used on
  // /group-pricing.html, packages.html and package-detail.html.
  const result = PricingEngine.computePrice({ days: pkg.days, pax, tier, month });
  const b = result.breakdown;
  const vehicleCount = result.fleet.count;

  const budgetPP  = PricingEngine.computePrice({ days: pkg.days, pax, tier:'budget',  month }).totalPP;
  const premiumPP = PricingEngine.computePrice({ days: pkg.days, pax, tier:'premium', month }).totalPP;
  const luxuryPP  = PricingEngine.computePrice({ days: pkg.days, pax, tier:'luxury',  month }).totalPP;

  const hotelPP = b.hotelPP;
  const transportPP = b.vehiclePP;
  const pricePP = result.totalPP;
  const grandTotal = result.groupTotal;

  const seasonWarn = checkSeasonWarning(pkg, month);
  
  const days = pkg.days||3;
  const totalDays = days+1;
  const dayNotes = (pkg.day_notes||'').split('. Day ').filter(Boolean);
  
  const inclusions = (pkg.inclusions||'').split(',');
  const exclusions = (pkg.exclusions||'').split(',');
  
  const highlights = (pkg.highlights||'').split(';').filter(Boolean);

  let html = '';

  // Package name & tags
  html += `<div class="pkg-header animate-in">
    <div class="pkg-name">${pkg.name}</div>
    <div style="font-size:12px;color:var(--pine-light);margin:4px 0 8px;line-height:1.4">${pkg.route_path||''}</div>
    <div class="pkg-tags">
      <span class="tag tag-days">${totalDays}D/${days}N</span>
      <span class="tag tag-season">${getSeasonLabel(pkg.best_season)}</span>
      ${(pkg.ideal_for||'').split(',').map(t=>`<span class="tag tag-ideal">${t.trim()}</span>`).join('')}
      ${pkg.snow_risk==='high'?'<span class="tag tag-snow">Snow risk: High</span>':''}
      ${pkg.drive_level==='high'?'<span class="tag tag-drive" style="background:#fffbeb;color:#b45309">Drive: Challenging</span>':''}
    </div>
  </div>`;

  // Route + km
  html += `<div class="route-bar animate-in" style="animation-delay:0.05s">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    <span><strong>${gateway}</strong> → <strong>${drop}</strong> · ${totalDays} days incl. travel day</span>
    <span class="km-badge">${totalKm} km total</span>
  </div>`;

  if(seasonWarn){
    html += `<div class="season-warn animate-in" style="animation-delay:0.08s">${seasonWarn}</div>`;
  }
  if(isPeak){
    html += `<div class="season-warn animate-in" style="animation-delay:0.09s">Peak season surcharge (15%) applied for ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][month-1]}.</div>`;
  }

  // Cost cards — all 3 tiers
  html += `<div class="cost-section animate-in" style="animation-delay:0.1s">
    <h3>Price per person · ${pax} travellers · ${result.fleetLabel}</h3>
    <div class="cost-grid">
      <div class="cost-card budget ${tier==='budget'?'active':''}">
        <div class="cost-tier">Budget</div>
        <div class="cost-per-person">${fmt(budgetPP)}</div>
        <div class="cost-total">Total: ${fmt(budgetPP*pax)}</div>
        <div class="cost-vehicle">₹${PricingEngine.HOTEL_TIER_RATE.budget}/night hotel</div>
      </div>
      <div class="cost-card premium ${tier==='premium'?'active':''}">
        <div class="cost-tier">Premium</div>
        <div class="cost-per-person">${fmt(premiumPP)}</div>
        <div class="cost-total">Total: ${fmt(premiumPP*pax)}</div>
        <div class="cost-vehicle">₹${PricingEngine.HOTEL_TIER_RATE.premium}/night hotel</div>
      </div>
      <div class="cost-card luxury ${tier==='luxury'?'active':''}">
        <div class="cost-tier">Luxury</div>
        <div class="cost-per-person">${fmt(luxuryPP)}</div>
        <div class="cost-total">Total: ${fmt(luxuryPP*pax)}</div>
        <div class="cost-vehicle">₹${PricingEngine.HOTEL_TIER_RATE.luxury}/night hotel</div>
      </div>
    </div>

    <div class="breakdown animate-in" style="animation-delay:0.13s">
      <div class="breakdown-row"><span class="breakdown-label">Hotel (${b.nights} night${b.nights>1?'s':''} · ${tier})</span><span class="breakdown-val">${fmt(hotelPP)} /pp</span></div>
      <div class="breakdown-row"><span class="breakdown-label">Transport (${totalKm} km · ${vehicleCount} vehicle${vehicleCount>1?'s':''}${isPeak?' · peak':' · off-peak'})</span><span class="breakdown-val">${fmt(transportPP)} /pp</span></div>
      <div class="breakdown-row breakdown-total"><span class="breakdown-label">Selected tier total /pp</span><span class="breakdown-val">${fmt(pricePP)}</span></div>
      <div class="breakdown-row breakdown-total"><span class="breakdown-label">Grand total (${pax} pax)</span><span class="breakdown-val" style="font-size:1.05rem;color:var(--pine)">${fmt(grandTotal)}</span></div>
    </div>
  </div>`;

  html += '<div class="divider"></div>';

  // Highlights
  if(highlights.length>0){
    html += `<div class="cost-section animate-in" style="animation-delay:0.16s">
      <h3>Package highlights</h3>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${highlights.map(h=>`<span style="background:var(--pine-pale);color:var(--pine);font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid rgba(45,92,71,0.2)">${h.trim()}</span>`).join('')}
      </div>
    </div>`;
    html += '<div class="divider"></div>';
  }

  // Night plan
  if(pkg.night_plan){
    html += `<div class="cost-section animate-in" style="animation-delay:0.18s">
      <h3>Night stops</h3>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        ${pkg.night_plan.split(',').map(n=>`<span style="background:var(--gold-pale);color:var(--gold);font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid rgba(201,146,42,0.25)">${n.trim()}</span>`).join('')}
      </div>
    </div>`;
    html += '<div class="divider"></div>';
  }

  // Day-by-day itinerary
  if(pkg.day_notes){
    const rawDays = pkg.day_notes.split(/Day \d+:/i).filter(Boolean);
    html += `<div class="itinerary animate-in" style="animation-delay:0.2s;padding-top:1rem">
      <div class="itin-head">Day-by-day itinerary</div>`;
    rawDays.forEach((d,i)=>{
      html += `<div class="day-item">
        <div class="day-num">${i+1}</div>
        <div class="day-text">${d.trim()}</div>
      </div>`;
    });
    html += '</div>';
    html += '<div class="divider"></div>';
  }

  // Inclusions / Exclusions
  html += `<div class="inc-exc animate-in" style="animation-delay:0.22s;padding-top:1rem">
    <div class="inc-block">
      <h4>✓ Inclusions</h4>
      <ul>${inclusions.map(i=>`<li>${i.trim()}</li>`).join('')}</ul>
    </div>
    <div class="exc-block">
      <h4>✗ Exclusions</h4>
      <ul>${exclusions.map(e=>`<li>${e.trim()}</li>`).join('')}</ul>
    </div>
  </div>`;

  // Important notes
  if(pkg.day_notes||pkg.snow_risk){
    html += `<div style="padding:0 1.25rem 1.25rem" class="animate-in" style="animation-delay:0.25s">
      <div class="sticky-note">
        <strong>Important:</strong> Prices are per person on double sharing basis, calculated by the same formula as the public Group Pricing Calculator (vehicle + hotel + 10% service fee + 25% margin, rounded to the nearest ₹50). Children (5–12 yrs) at 50% discount. Cancellation: 15+ days = 90% refund; 7–14 days = 60%; 3–6 days = 30%; &lt;72 hrs = no refund.
      </div>
    </div>`;
  }

  document.getElementById('emptyState').style.display='none';
  document.getElementById('resultContent').style.display='block';
  document.getElementById('resultContent').innerHTML = html;
}

populatePackages();

// ─── AUTO-SELECT FROM URL PARAMS ─────────────────────────────────────────────
(function(){
  const params = new URLSearchParams(window.location.search);
  const pkgParam = params.get('pkg');
  const paxParam = params.get('pax');
  const tierParam = params.get('tier');

  if(pkgParam){
    const sel = document.getElementById('pkgSel');
    if([...sel.options].some(o=>o.value===pkgParam)){
      sel.value = pkgParam;
    }
  }
  if(paxParam){
    const n = parseInt(paxParam);
    if(n>=1 && n<=20){
      pax = n;
      document.getElementById('paxNum').textContent = pax;
    }
  }
  if(tierParam && ['budget','premium','luxury'].includes(tierParam)){
    document.querySelectorAll('.tier-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.tier===tierParam);
    });
    selectedTier = tierParam;
  }
  // Auto-calculate if package was specified
  if(pkgParam){ calculate(); }
})();
</script>
</body>
</html>
